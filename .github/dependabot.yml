# Squeeze is finished (docs/ROADMAP.md): routine version-update PRs are switched off.
# GitHub's Dependabot security alerts and security updates are unaffected by this file.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
