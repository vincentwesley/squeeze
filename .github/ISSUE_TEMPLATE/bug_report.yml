name: Bug report
description: Wrong output, a crash, a hang, or a file Squeeze should read but does not.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For security problems (a crash or hang on crafted input, unbounded memory), use **Security → Report a vulnerability** instead, as described in SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The API call or CLI command you ran, what you expected, and what you got (paste the full error, including the SqueezeError code).
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input
      description: Attach the smallest file that shows the problem, or code that generates it.
  - type: input
    id: version
    attributes:
      label: Versions
      description: Squeeze version, Node.js or browser version, operating system.
      placeholder: squeeze 1.0.0, Node 22.12, macOS 15
    validations:
      required: true
